name: Mod Panic social preview (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run isolated publisher tests
        run: python -m unittest bots.shared_social.test_brand_config bots.shared_social.test_meta_client -v
      - name: Preview-only confirmation
        run: echo "No credentials loaded. No live publishing performed."
