name: lint-links
permissions:
  contents: write
  issues: write
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify old-owner guard regression cases
        run: >-
          python3 -m unittest discover -s tests/scripts
          -p 'test_legacy_github_links.py' -v
      - name: Reject obsolete GitHub owner references
        run: python3 scripts/check_legacy_github_links.py
