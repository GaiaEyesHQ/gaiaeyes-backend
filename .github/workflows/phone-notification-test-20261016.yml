---
name: One phone notification test (2026-10-16)

"on":
  workflow_dispatch:
    inputs:
      expected_updated_at:
        description: Exact current registration updated_at (UTC)
        required: true
        type: string
      confirm_single_send:
        description: Send the one authorized generic test; never rerun
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: phone-notification-test-20261016
  cancel-in-progress: false

jobs:
  send-once:
    if: >-
      github.repository == 'GaiaEyesHQ/gaiaeyes-backend' &&
      github.repository_id == '1031061846' &&
      github.actor_id == '224334203' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.workflow_ref == format('{0}/{1}@{2}', github.repository,
      '.github/workflows/phone-notification-test-20261016.yml', github.ref) &&
      github.run_number == 2 && github.run_attempt == 1 &&
      inputs.confirm_single_send
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Refuse duplicate dispatches and reruns
        env:
          CONFIRM_SINGLE_SEND: ${{ inputs.confirm_single_send }}
        run: python -m bots.notifications.github_notification_test --check-context
      - name: Install the existing pinned database dependency
        run: python -m pip install 'psycopg[binary]==3.2.12'
      - name: Prepare the send reservation without secrets
        env:
          CONFIRM_SINGLE_SEND: ${{ inputs.confirm_single_send }}
        run: python -m bots.notifications.github_notification_test --reserve
      - name: Persist immutable reservation before any send
        id: reserve
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-test-reservation-${{ github.run_id }}
          path: >-
            ${{ runner.temp }}/phone-notification-test-20261016/reservation.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Revalidate and send exactly once
        env:
          CONFIRM_SINGLE_SEND: ${{ inputs.confirm_single_send }}
          EXPECTED_UPDATED_AT: ${{ inputs.expected_updated_at }}
          RESERVATION_ARTIFACT_ID: ${{ steps.reserve.outputs.artifact-id }}
          RESERVATION_ARTIFACT_DIGEST: ${{ steps.reserve.outputs.artifact-digest }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
        run: python -m bots.notifications.github_notification_test
      - name: Preserve sanitized receipt (absence never permits retry)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-test-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/phone-notification-test-20261016/*.json*
          if-no-files-found: warn
          retention-days: 90
